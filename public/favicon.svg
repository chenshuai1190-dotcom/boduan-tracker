<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 背景: 深黑 + 金光晕 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#171717"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.15" cy="0.15" r="1">
      <stop offset="0%" stop-color="rgba(251,191,36,0.28)"/>
      <stop offset="65%" stop-color="rgba(251,191,36,0)"/>
    </radialGradient>
    <linearGradient id="xg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- 圆角方块背景 -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <rect width="512" height="512" rx="115" fill="url(#glow)"/>
  <!-- 金边框 -->
  <rect x="3" y="3" width="506" height="506" rx="112" fill="none" stroke="rgba(251,191,36,0.25)" stroke-width="4"/>
  <!-- 经典粗体 X -->
  <path d="M150 150 L362 362 M362 150 L150 362"
        stroke="url(#xg)" stroke-width="60" stroke-linecap="round" fill="none"/>
</svg>
